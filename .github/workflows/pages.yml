name: Deploy to GitHub Pages

# Publishes the site on every push to main. The catalog is rebuilt here rather
# than trusted from the commit, so the landing page always lists exactly the
# cheat sheets that are actually in the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Sheets are authored elsewhere and dropped in as fragments, so give them
      # their document scaffolding here too. Pushing a raw file then publishes
      # correctly whether or not the local step was run.
      - name: Normalise any newly added sheets
        run: python tools/adopt_sheet.py

      - name: Rebuild the catalog from the sheets on disk
        run: python tools/build_catalog.py

      - name: Check links, metadata and markup
        run: python tools/check_site.py

      - name: Assemble the published tree
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'tools' \
            --exclude 'templates' \
            --exclude 'CLAUDE.md' \
            --exclude 'README.md' \
            ./ _site/

      # enablement: true turns Pages on when the workflow token is allowed to.
      # On a repository that has never had Pages, it usually is not, and this
      # step fails until someone enables Pages once by hand.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Explain how to finish enabling Pages
        if: failure()
        run: |
          echo "::error title=GitHub Pages is not enabled::Open Settings -> Pages, set Source to 'GitHub Actions', then re-run this workflow. This is a one-time step."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
